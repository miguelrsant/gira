<meta charset="utf-8">
<title>GIRA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Patrick+Hand+SC&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: tela cheia WebGL; UI de papel recortado flutuando nas bordas, como no Messenger. Um visual único (mundo verde-azulado), sem tema escuro. */
:root {
  --sky: #5fbfb9;
  --ink: #373f42;
  --paper: #f4f4ef;
  --paper-shadow: rgba(55, 63, 66, .38);
  --blue: #66bde6;
  --blue-dark: #3f8fb8;
  --yellow: #f3c258;
  --yellow-dark: #b8862f;
  --red: #c25959;
  --orange: #de794e;
  --green: #8cc48c;
  --muted: #7d8a88;
  --veil: rgba(95, 191, 185, .18);
  --font-title: "Bungee", "Arial Black", Impact, sans-serif;
  --font-label: "Silkscreen", "Courier New", monospace;
  --font-hand: "Patrick Hand SC", "Comic Sans MS", "Chalkboard SE", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--sky); color: var(--ink);
  font-family: var(--font-hand); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

.paper {
  background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--paper-shadow);
  clip-path: polygon(0.6% 2%, 99.2% 0, 100% 97.5%, 1.2% 100%);
}
.layer { position: fixed; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }

/* ---------- Carregando (tela branca com rabisco, igual à referência) ---------- */
#loader {
  position: fixed; inset: 0; z-index: 60; background: #fff; display: grid; place-items: center;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}
#loader.wipe { transition: clip-path .95s cubic-bezier(.65, 0, .35, 1); clip-path: polygon(0 0, 100% 0, 100% -40%, 0 -12%); }
#loader.hidden { display: none; }
#loader .doodle { display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity .3s; }
#loader .doodle svg { width: 58px; height: 58px; overflow: visible; }
#loader .doodle .spin { transform-origin: 29px 34px; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
#loader .doodle span { font-size: 13px; letter-spacing: .14em; color: var(--ink); }
#loader.quiet .doodle { opacity: 0; }

#sheet { position: fixed; inset: 0; z-index: 61; pointer-events: none; display: none; overflow: hidden; }
#sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 100%; box-shadow: 0 14px 40px rgba(55, 63, 66, .28); }
#sheet.go canvas { transition: transform .9s cubic-bezier(.55, 0, .75, .4); transform: translateY(-122%) rotate(-7deg) scale(1.05); }

/* ---------- Título ---------- */
#title { z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: calc(5vh + env(safe-area-inset-bottom, 0px)); }
#title > * { pointer-events: none; }
#start {
  pointer-events: auto;
  font-family: var(--font-label); font-weight: 700; font-size: clamp(17px, 2.2vw, 22px); letter-spacing: .1em; color: #fff;
  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill;
  background: var(--yellow); border: 2.5px solid var(--ink); padding: 12px 38px 13px; cursor: pointer;
  box-shadow: inset 0 -6px 0 var(--yellow-dark), 4px 5px 0 var(--paper-shadow);
  clip-path: polygon(0 5%, 100% 0, 99% 100%, 1% 95%);
  transform: scale(0); opacity: 0;
}
#start.in { animation: popin .5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
#start.in:hover { animation: none; transform: scale(1.06) rotate(-1.5deg); opacity: 1; }
#start.press { animation: none; transform: scale(.88, .8); opacity: 1; transition: transform .08s; }
#start.out { animation: none; transform: scale(0); opacity: 1; transition: transform .25s cubic-bezier(.5, -0.6, .7, .3); }
@keyframes popin { from { transform: scale(0) rotate(6deg); opacity: 1; } to { transform: scale(1) rotate(-1deg); opacity: 1; } }
#tagline { margin-top: 14px; font-size: clamp(15px, 1.8vw, 18px); color: #eaf7f3; text-shadow: 0 2px 0 rgba(55,63,66,.35); opacity: 0; transition: opacity .8s; text-align: center; padding: 0 16px; }
#tagline.in { opacity: 1; }

/* ---------- HUD ---------- */
#hud { z-index: 10; opacity: 0; transition: opacity .6s ease; }
#hud.on { opacity: 1; }
#hud:not(.on) * { pointer-events: none; }
#daycard {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
  padding: 10px 14px 12px; min-width: 190px; pointer-events: none;
}
#daycard .dname { font-family: var(--font-label); font-weight: 700; font-size: 18px; letter-spacing: .06em; }
#daycard .drow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#daycard .clock { font-family: var(--font-label); font-size: 22px; font-variant-numeric: tabular-nums; }
#daycard .week { font-family: var(--font-label); font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.bar { margin-top: 8px; height: 12px; border: 2px solid var(--ink); background: #dfe4dc; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--orange); }
.barlabel { margin-top: 4px; font-size: 15px; display: flex; justify-content: space-between; }
#stopped {
  position: absolute; top: calc(124px + env(safe-area-inset-top, 0px)); left: calc(18px + env(safe-area-inset-left, 0px));
  font-family: var(--font-label); font-size: 12px; letter-spacing: .08em; padding: 5px 10px;
  background: var(--ink); color: var(--paper); transform: rotate(-2deg); opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
#stopped.on { opacity: 1; }

.side { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.side.top { top: calc(14px + env(safe-area-inset-top, 0px)); }
.side.bottom { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transition: opacity .2s, transform .25s; }
body.talking .side.bottom { opacity: 0; pointer-events: none; transform: translateX(10px); }
.sbtn { width: 58px; height: 58px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.sbtn svg { width: 32px; height: 32px; }
.sbtn:hover { transform: rotate(-3deg) scale(1.04); }
.sbtn:active { transform: scale(.95); }

#prompt {
  position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) rotate(-1deg);
  font-family: var(--font-label); font-size: 14px; letter-spacing: .06em; padding: 8px 14px; cursor: pointer;
  display: none; white-space: nowrap;
}
#prompt.on { display: block; }
#prompt b { background: var(--blue); color: #fff; padding: 1px 7px; margin-right: 6px; border: 2px solid var(--ink); }

#hint {
  position: absolute; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-size: 17px; padding: 8px 16px; text-align: center; max-width: calc(100vw - 160px);
  opacity: 0; transition: opacity .6s; pointer-events: none;
}
#hint.on { opacity: 1; }
body.talking #hint.on { opacity: 0; transition: opacity .15s; }

#toast {
  position: absolute; left: 50%; top: calc(22px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -14px) rotate(-1.5deg);
  text-align: center; padding: 8px 22px 10px; opacity: 0; transition: opacity .5s, transform .5s; pointer-events: none;
}
#toast.on { opacity: 1; transform: translate(-50%, 0) rotate(-1.5deg); }
#toast .t { font-family: var(--font-title); font-size: clamp(20px, 3vw, 30px); line-height: 1.05; }
#toast .s { font-size: 16px; color: #56625f; }

/* ---------- balões no mundo ---------- */
#bubbles { z-index: 8; }
#bubbles > * { pointer-events: none; }
.bubble {
  position: absolute; left: 0; top: 0; max-width: 220px; padding: 7px 12px 8px; font-size: 17px; line-height: 1.15;
  background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--paper-shadow);
  transform-origin: 50% 100%; display: none; white-space: normal; width: max-content;
  border-radius: 3px 10px 4px 9px;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -10px; width: 14px; height: 14px; margin-left: -7px;
  background: var(--paper); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  transform: rotate(45deg);
}
.bubble.on { display: block; }
.bubble.click { pointer-events: auto; cursor: pointer; }
.marker {
  position: absolute; left: 0; top: 0; width: 26px; height: 26px; display: none;
  background: var(--paper); border: 2px solid var(--ink); transform-origin: 50% 50%;
  font-family: var(--font-label); font-weight: 700; font-size: 15px; line-height: 22px; text-align: center;
}
.marker.on { display: block; }
.marker.quest { background: var(--yellow); }
.marker.read { background: #dff1ee; border-radius: 50%; }
.marker span { display: block; transform: rotate(-45deg); }
.marker.read span { transform: none; }
.emote {
  position: absolute; left: 0; top: 0; padding: 4px 10px; font-family: var(--font-label); font-weight: 700; font-size: 22px;
  background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--paper-shadow); display: none;
}
.emote.on { display: block; }

/* ---------- diálogo (cartão de fala, no jeito da referência) ---------- */
:root { --card: #f8f8f4; --card-low: #e4ebe7; --card-shadow: #7f98a1; --tag-shadow: #4f6a74; }
#dialog {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(800px, calc(100vw - 40px)); z-index: 20; display: none;
}
#dialog.on { display: block; animation: dlgIn .34s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes dlgIn { from { transform: translateX(-50%) translateY(28px); opacity: 0; } }
/* retrato: uma janela vazada; o rosto é desenhado no próprio canvas do jogo, por baixo */
#dport {
  position: absolute; left: 8px; bottom: calc(100% + 2px); width: 112px; height: 112px; display: none;
  border: 3px solid var(--ink); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 5.5px var(--ink), 4px 5px 0 var(--card-shadow);
  pointer-events: none;
}
#dialog.port #dport { display: block; animation: portIn .42s cubic-bezier(.2, 1.55, .4, 1); }
@keyframes portIn { from { transform: translateY(18px) scale(.55); } }
#dname {
  position: absolute; left: 20px; top: -17px; z-index: 3; white-space: nowrap;
  font-family: var(--font-label); font-weight: 700; font-size: 19px; letter-spacing: .05em; line-height: 1;
  color: #fff; background: var(--tag, var(--blue)); padding: 7px 18px 9px;
  border: 2.5px solid var(--ink); border-radius: 2px;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .17), inset 0 2px 0 rgba(255, 255, 255, .35), 3px 4px 0 var(--tag-shadow);
  transform: rotate(-2.2deg); -webkit-text-stroke: 1.3px var(--ink); paint-order: stroke fill;
}
#dialog.port #dname { left: 136px; }
#dbox { position: relative; z-index: 0; isolation: isolate; box-sizing: border-box; min-height: 104px; padding: 28px 78px 26px 46px; cursor: pointer; text-align: center; display: flex; flex-direction: column; justify-content: center; }
#dbox::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--card); border: 2.5px solid var(--ink); border-radius: 3px 6px 4px 7px;
  box-shadow: inset 0 -5px 0 var(--card-low), 5px 6px 0 var(--card-shadow);
  transform: skewX(-2.2deg) rotate(-.3deg);
}
#dtext {
  display: block; font-family: var(--font-hand); font-size: clamp(19px, 2.3vw, 25px); line-height: 1.32;
  letter-spacing: .035em; text-transform: uppercase; color: var(--ink); overflow-wrap: anywhere;
}
#dtext .w { display: inline-block; white-space: nowrap; }
#dtext .c { display: inline-block; }
#dtext .c.h { visibility: hidden; }
#dtext .c.in { animation: chIn .24s cubic-bezier(.2, 1.7, .45, 1) both; }
@keyframes chIn { from { transform: translateY(.42em) scale(.25) rotate(-14deg); opacity: 0; } }
#dtext .c.em { color: var(--tagd, #c25959); }
#dtext .c.em > i { display: inline-block; font-style: normal; animation: wave 1.15s ease-in-out infinite; animation-delay: calc(var(--k) * -.11s); }
@keyframes wave { 50% { transform: translateY(-.16em) rotate(2deg); } }
#dnext {
  position: absolute; right: -14px; bottom: -16px; width: 52px; height: 52px; cursor: pointer; padding: 0;
  background: var(--card); border: 2.5px solid var(--ink); box-shadow: inset 0 -4px 0 var(--card-low), 4px 5px 0 var(--card-shadow);
  display: grid; place-items: center; transform: skewX(-2.2deg);
}
#dnext svg { width: 24px; height: 24px; animation: nudge .85s ease-in-out infinite; }
#dnext.wait svg { animation: none; opacity: .3; }
#dnext { transition: opacity .15s; }
#dialog.choosing #dnext { opacity: 0; pointer-events: none; }
@keyframes nudge { 50% { transform: translateX(3px); } }
#choices { display: none; gap: 14px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
#choices.on { display: flex; }
#choices button {
  font-family: var(--font-hand); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; padding: 9px 18px 11px; cursor: pointer;
  background: var(--card); border: 2.5px solid var(--ink); box-shadow: inset 0 -4px 0 var(--card-low), 3px 4px 0 var(--card-shadow);
  transform: rotate(-1deg); transition: transform .12s;
}
#choices button.main { background: var(--yellow); box-shadow: inset 0 -4px 0 var(--yellow-dark), 3px 4px 0 var(--card-shadow); }
#choices button:hover, #choices button.sel { transform: rotate(-1.5deg) translateY(-2px) scale(1.04); }
#choices button.sel { outline: 3px solid var(--blue); outline-offset: 3px; }
body.talking.portrait #bubbles { opacity: 0; }
#bubbles { transition: opacity .2s; }

/* ---------- painéis ---------- */
.panel {
  position: fixed; z-index: 25; right: calc(86px + env(safe-area-inset-right, 0px)); width: min(340px, calc(100vw - 120px));
  padding: 18px 20px; display: none;
}
.panel.on { display: block; animation: pop .25s cubic-bezier(.2,.9,.3,1.4); }
@keyframes pop { from { transform: scale(.85) rotate(-3deg); opacity: 0; } }
.panel h2 { font-family: var(--font-label); font-weight: 700; font-size: 17px; letter-spacing: .06em; margin: 0 0 12px; }
.panel h3 { font-family: var(--font-label); font-weight: 700; font-size: 12px; letter-spacing: .08em; margin: 14px 0 4px; color: var(--muted); }
#menu { top: calc(14px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 40px); overflow: auto; }
.task { display: flex; gap: 10px; align-items: flex-start; font-size: 19px; line-height: 1.15; padding: 6px 0; border-bottom: 1.5px dashed #c5ccc6; }
.task .box { flex: none; width: 18px; height: 18px; border: 2px solid var(--ink); margin-top: 2px; display: grid; place-items: center; font-family: var(--font-label); font-size: 13px; }
.task.done { color: var(--muted); text-decoration: line-through; }
.task.done .box { background: var(--green); }
.keys { margin-top: 14px; font-size: 16px; line-height: 1.4; color: #4e5a5b; }
.keys kbd { font-family: var(--font-label); font-size: 11px; border: 1.5px solid var(--ink); padding: 0 4px; background: #fff; }
.small { font-family: var(--font-label); font-size: 11px; letter-spacing: .06em; background: var(--paper); border: 2px solid var(--ink); padding: 6px 10px; cursor: pointer; margin-top: 12px; }
#wardrobe { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.wrow { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 8px; margin: 8px 0; }
.wrow button { width: 34px; height: 34px; background: var(--blue); border: 2px solid var(--ink); cursor: pointer; color: #fff; font-family: var(--font-label); font-weight: 700; font-size: 16px; padding: 0; }
.wrow .lbl { text-align: center; font-size: 19px; }
.wrow .lbl small { display: block; font-family: var(--font-label); font-size: 10px; letter-spacing: .08em; color: var(--muted); }
#emotes { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: auto; }
#emotes .grid { display: grid; grid-template-columns: repeat(3, 56px); gap: 10px; }
#emotes .grid button { height: 50px; background: var(--paper); border: 2px solid var(--ink); cursor: pointer; font-family: var(--font-label); font-weight: 700; font-size: 20px; box-shadow: 2px 2px 0 var(--paper-shadow); }

/* ---------- transições ---------- */
#fade { position: fixed; inset: 0; z-index: 40; background: var(--sky); opacity: 0; pointer-events: none; transition: opacity .7s ease; display: grid; place-items: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade.see { background: var(--veil); }
#fade .card { padding: 26px 40px; text-align: center; transform: rotate(-1.5deg); max-width: 86vw; }
#fade .card .k { font-family: var(--font-label); font-size: 14px; letter-spacing: .12em; color: var(--muted); }
#fade .card .t { font-family: var(--font-title); font-size: clamp(34px, 6vw, 60px); line-height: 1.05; margin: 8px 0; color: var(--ink); }
#fade .card .s { font-size: 22px; }
#fade .card .btns { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
#fade .card .btns button { font-family: var(--font-label); font-weight: 700; font-size: 15px; letter-spacing: .06em; padding: 10px 18px; border: 2px solid var(--ink); background: var(--yellow); cursor: pointer; box-shadow: 3px 3px 0 var(--paper-shadow); }
#fade .card .btns button.alt { background: var(--paper); }

/* ---------- toque ---------- */
#joy { position: fixed; z-index: 12; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(55,63,66,.6); background: rgba(244,244,239,.25); display: none; pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
#jumpbtn { position: fixed; z-index: 12; display: none; right: calc(90px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; font-family: var(--font-label); font-size: 11px; font-weight: 700; }
body.touch.playing #jumpbtn { display: grid; place-items: center; }
body.talking #jumpbtn, body.talking #prompt { display: none; }
body.touch #hint { max-width: calc(100vw - 200px); font-size: 15px; }
@media (max-width: 560px) {
  #daycard { min-width: 150px; padding: 8px 10px; }
  #daycard .dname { font-size: 14px; }
  #daycard .clock { font-size: 17px; }
  .sbtn { width: 48px; height: 48px; }
  .sbtn svg { width: 26px; height: 26px; }
  .side { gap: 10px; }
  #dbox { padding: 26px 50px 20px 22px; min-height: 92px; }
  #dtext { font-size: 18px; }
  #dport { width: 78px; height: 78px; left: 4px; }
  #dialog.port #dname { left: 96px; }
  #dname { font-size: 14px; padding: 6px 12px 8px; top: -15px; left: 12px; }
  #choices button { font-size: 17px; padding: 8px 12px 10px; }
  .panel { right: calc(70px + env(safe-area-inset-right, 0px)); width: calc(100vw - 96px); }
  #dialog { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); transform: none; width: auto; }
  #dnext { right: -6px; bottom: -14px; width: 46px; height: 46px; }
  #dialog.on { animation: dlgInM .3s cubic-bezier(.2, .9, .3, 1.25); }
  @keyframes dlgInM { from { transform: translateY(24px); opacity: 0; } }
  #prompt { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
  #stopped { top: calc(116px + env(safe-area-inset-top, 0px)); }
  #prompt { left: calc(50% - 30px); }
  #hint, body.touch #hint { left: 16px; right: 76px; transform: none; max-width: none; bottom: calc(98px + env(safe-area-inset-bottom, 0px)); font-size: 15px; }
  #toast { top: calc(96px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } #start { transform: none; opacity: 1; } }
</style>

<canvas id="game"></canvas>

<div id="bubbles" class="layer"></div>

<div id="title" class="layer">
  <button id="start" aria-label="Começar">COMEÇAR</button>
  <div id="tagline">É um planeta pequeno, mas alguém tem que fazer ele girar.</div>
</div>

<div id="hud" class="layer">
  <div id="daycard" class="paper">
    <div class="drow"><span class="dname" id="dname-hud">SEGUNDA</span><span class="clock" id="clock">07:00</span></div>
    <div class="week" id="week">DIA 1 DE 7 · SEMANA 1</div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="barlabel"><span>volta do dia</span><span id="pct">0%</span></div>
  </div>
  <div id="stopped">VOCÊ PAROU. O DIA PAROU.</div>
  <div id="toast" class="paper"><div class="t" id="toast-t"></div><div class="s" id="toast-s"></div></div>
  <div class="side top">
    <button class="sbtn paper" id="btn-menu" aria-label="Expediente">
      <svg viewBox="0 0 32 32" fill="none" stroke="#4e6470" stroke-width="3.2" stroke-linecap="round"><circle cx="6" cy="8" r="1.6" fill="#4e6470"/><circle cx="6" cy="16" r="1.6" fill="#4e6470"/><circle cx="6" cy="24" r="1.6" fill="#4e6470"/><path d="M12 8h15M12 16h15M12 24h15"/></svg>

const U = { time: { value: 0 } };
const GLSL_NOISE = `

{

{

{

  #endif

const WIND_VS = `
{

  vec3 ew = normalize(cross(upw, vec3(0.0, 1.0, 0.0)) + vec3(1e-4));

`;

{

// o: { pat, ground, wind, grass, uid }
function patchMat(mat, o = {}) {

  if (o.ground) defs.push('#define P_GROUND');
  if (o.grass) defs.push('#define P_GRASS');

      #endif

const FOOT = [];          // pegadas ocupadas (para o loteamento automático não sobrepor)
const RESERVED = [];      // áreas sem loteamento automático
const BUILDS = [];        // construções a montar depois do terreno
const COLLIDERS = [];     // { d, r } círculos e { box } caixas
const INTERACT = [];      // easter eggs: placas, cartazes, objetos
const PAGES = [];         // páginas de calendário escondidas
const SPOTS = {};         // posições nomeadas (NPCs, câmera, etc.)
const DISTRICTS = [];
const WIRES = [];         // pares de pontos para os fios
const DYN = {};           // objetos animados

function reserve(lat, lon, r) { RESERVED.push({ d: dirOf(lat, lon), r }); }
function isReserved(d, pad = 0) { for (const z of RESERVED) if (arcDist(d, z.d) < z.r + pad) return true; return false; }
function footOf(c, w, d, cx = 0, cz = 0) {
  const p = ctxPoint(c, cx, 0, cz).normalize();
  const r = new THREE.Vector3().setFromMatrixColumn(c.W, 0).normalize(), f = new THREE.Vector3().setFromMatrixColumn(c.W, 2).normalize();
  return { c: p.multiplyScalar(R), r, f, hw: w / 2, hd: d / 2 };
}
function obbOverlap(A, B, pad = 0.3) {
  const T = tmpV.subVectors(B.c, A.c);
  for (const ax of [A.r, A.f, B.r, B.f]) {
    const ra = A.hw * Math.abs(A.r.dot(ax)) + A.hd * Math.abs(A.f.dot(ax));
    const rb = B.hw * Math.abs(B.r.dot(ax)) + B.hd * Math.abs(B.f.dot(ax));
    if (Math.abs(T.dot(ax)) > ra + rb + pad) return false;
  }
  return true;
}
function footFree(F, pad = 0.3) { for (const o of FOOT) if (obbOverlap(F, o, pad)) return false; return true; }
// tall: prédio (a câmera não atravessa)
function addBoxCollider(c, w, d, cx = 0, cz = 0, tall = false) {
  const F = footOf(c, w, d, cx, cz);
  COLLIDERS.push({ box: true, tall, c: F.c.clone().normalize(), r: F.r, f: F.f, hw: F.hw, hd: F.hd, rad: Math.hypot(F.hw, F.hd) });
  return F;
}
function addCircle(d, r) { COLLIDERS.push({ d: d.clone().normalize(), r }); }
function addCircleLocal(c, x, z, r) { addCircle(ctxDir(c, x, z), r); }
// lote: registra zona aplainada + pegada + colisor, e agenda a construção
function lot(c, w, d, o = {}) {
  const F = footOf(c, w + (o.padW || 0), d + (o.padD || 0), o.cx || 0, o.cz || 0);
  FOOT.push(F);
  if (o.zone !== false) addZone(ctxDir(c, o.cx || 0, o.cz || 0), c.fwd, (w + (o.padW || 0)) / 2 + 0.4, (d + (o.padD || 0)) / 2 + 0.4, { h: c.h, kind: o.kind || 'paved', m: o.m ?? 1.8 });
  if (o.collide !== false) addBoxCollider(c, o.colW || w, o.colD || d, o.ccx || 0, o.ccz || 0, true);
}
// contexto ao longo de uma rua, de frente para ela
function nearestSample(rd, lat, lon) {
  const d = dirOf(lat, lon); let bi = 0, bd = -2;
  rd.S.forEach((s, i) => { const v = s.d.dot(d); if (v > bd) { bd = v; bi = i; } });
  return bi;
}
function besideRoad(rd, i, side, depth, setback = 0.4, o = {}) {
  const s = rd.S[i];
  const lat = side * (rd.hw + rd.sw + setback + depth / 2);
  const d = s.d.clone().addScaledVector(s.s, lat / R).normalize();
  const fwd = s.s.clone().multiplyScalar(-side);
  const h = o.h !== undefined ? o.h : H(d);
  return placeDir(d, fwd, { h });
}
// ponto na calçada (para postes, lixeiras, placas)
function onSidewalk(rd, i, side, inset = 0.35) {
  const s = rd.S[((i % rd.S.length) + rd.S.length) % rd.S.length];
  const lat = side * (rd.hw + rd.sw - inset);
  const d = s.d.clone().addScaledVector(s.s, lat / R).normalize();
  return placeDir(d, s.s.clone().multiplyScalar(-side), { h: s.h + rd.top + 0.13 });
}
function interact(c, x, y, z, o) {
  const p = ctxPoint(c, x, y, z);
  INTERACT.push(Object.assign({ pos: p, dir: p.clone().normalize(), r: 2.2 }, o));
}
function district(name, sub, lat, lon, r) { DISTRICTS.push({ name, sub, d: dirOf(lat, lon), r }); }

// ---------------- peças especiais ----------------
function plazaDisc(c, r) {
  const g = G(c, { layer: 'road' }), n = 40, y = 0.06;
  const P = (a, rr2, yy) => ctxPoint(c, Math.cos(a) * rr2, yy, Math.sin(a) * rr2, new THREE.Vector3());
  const cen = ctxPoint(c, 0, y, 0, new THREE.Vector3());
  const col1 = C('#d2d0c2'), col2 = C('#b9b4a4');
  for (let k = 0; k < n; k++) {
    const a0 = k / n * Math.PI * 2, a1 = (k + 1) / n * Math.PI * 2;
    const p0 = P(a0, r, y), p1 = P(a1, r, y);
    g.quad(cen, p1, p0, cen, col1, { pat: 6, id: 2, q: [[0, 0], [Math.cos(a1) * r, Math.sin(a1) * r], [Math.cos(a0) * r, Math.sin(a0) * r], [0, 0]] });
    g.quad(P(a0, r, y), P(a1, r, y), P(a1, r, -0.3), P(a0, r, -0.3), col2, { id: 2 });
  }
}
function fieldLine(c, x0, z0, x1, z1) {
  const g = G(c, { layer: 'road' }), w = 0.07, y = 0.03;
  const dx = x1 - x0, dz = z1 - z0, l = Math.hypot(dx, dz), nx = -dz / l * w, nz = dx / l * w;
  const A = ctxPoint(c, x0 - nx, y, z0 - nz, new THREE.Vector3()), B = ctxPoint(c, x0 + nx, y, z0 + nz, new THREE.Vector3());
  const Cc = ctxPoint(c, x1 + nx, y, z1 + nz, new THREE.Vector3()), D = ctxPoint(c, x1 - nx, y, z1 - nz, new THREE.Vector3());
  const up = c.d, n = tmpV.subVectors(B, A).cross(tmpV2.subVectors(D, A));
  if (n.dot(up) >= 0) g.quad(A, B, Cc, D, C('#f4f4ef'), { id: 0 }); else g.quad(A, D, Cc, B, C('#f4f4ef'), { id: 0 });
}
function poolAt(c, w, d) {
  K.box(c, 0, -0.35, 0, w + 0.6, 0.45, d + 0.6, '#e9ebe4', { id: 5, pat: 6 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), waterMat.clone());
  const dep = new Float32Array(4).fill(1.3); m.geometry.setAttribute('aDepth', new THREE.BufferAttribute(dep, 1));
  m.material.uniforms = THREE.UniformsUtils.clone(waterMat.uniforms);
  m.material.uniforms.cShallow.value.set('#7fd6e0'); m.material.uniforms.cDeep.value.set('#4fb3cf');
  const L = new THREE.Matrix4().compose(new THREE.Vector3(0, 0.12, 0), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2), new THREE.Vector3(1, 1, 1));
  m.matrixAutoUpdate = false; m.matrix.copy(c.W).multiply(L); m.matrixWorldNeedsUpdate = true;
  scene.add(m); DYN.pools = DYN.pools || []; DYN.pools.push(m);
  PLATFORMS.push({ test: () => null });
}

function streetFurniture() {
  for (const rd of ROADS) {
    if (rd.kind !== 'asphalt' || !rd.sw) continue;
    const S = rd.S, N = S.length, every = Math.max(10, Math.round(9 / rd.step));
    let prev = null;
    for (let i = 3; i < N - (rd.closed ? 0 : 3); i += every) {
      const s = S[i]; if (s.inter || s.cutR) { prev = null; continue; }
      const c = onSidewalk(rd, i, 1, 0.3);
      if (isNearAny(c.d, 0.9)) { prev = null; continue; }
      const pts = utilPole(c, 0, 0);
      addCircle(c.d, 0.25);
      if (prev) for (let k = 0; k < 4; k++) WIRES.push([prev[k], pts[k]]);
      prev = pts;
      // do outro lado: luminária
      const c2 = onSidewalk(rd, i + Math.floor(every / 2), -1, 0.3);
      if (!S[(i + Math.floor(every / 2)) % N].cutL && !isNearAny(c2.d, 0.9)) { lampPost(c2, 0, 0); addCircle(c2.d, 0.2); }
    }
    if (rd.closed && prev) { /* fecha o anel só se o primeiro poste existir */ }
    // lixeiras, hidrantes, cones, placas "proibido parar"
    for (let i = 7; i < N - 3; i += Math.round(every * 1.7)) {
      const side = (i % 2) ? 1 : -1, s = S[i];
      if (s.inter || (side > 0 ? s.cutR : s.cutL)) continue;
      const c = onSidewalk(rd, i, side, 0.32);
      if (isNearAny(c.d, 0.8)) continue;
      const k = Math.floor(rand() * 6);
      if (k === 0) trashBin(c, 0, 0); else if (k === 1) hydrant(c, 0, 0); else if (k === 2) bollard(c, 0, 0);
      else if (k === 3 && rd === MAIN) { signPost(c, 0, 0, texSign('PROIBIDO\nPARAR', '#c25959', '#f4f4ef', { w: 256, h: 192, font: 'lbl' }), 0.7, 0.55); interact(c, 0, 1.8, 0, { name: 'PLACA', lines: ['PROIBIDO PARAR.', '(Inclusive você.)'] }); }
      else if (k === 4) cone(c, 0, 0);

      addCircle(c.d, 0.3);
    }
  }
}

function buildWires() {

function scatter() {
  const tryAt = (lat, lon, fn, r = 0.6) => {
    const d = dirOf(lat, lon);
    const h = H(d, scatter.info);
    if (h < SEA + 0.4 || scatter.info.road > 0.05 || scatter.info.lot > 0.2) return false;
    if (trailDist(d) < 0.7) return false;
    if (isNearAny(d, r + 0.4)) return false;
    for (const F of FOOT) if (arcDist(d, tmpV3.copy(F.c).normalize()) < Math.hypot(F.hw, F.hd) + r) return false;
    const c = placeDir(d, headingVec(d, rand() * 360), { h, lift: -0.05 });
    fn(c); addCircle(d, r * 0.6);
    return true;
  };
  scatter.info = {};
  const N = LOW ? 420 : 640;
  let placed = 0;
  for (let k = 0; k < N * 3 && placed < N; k++) {
    const y = rr(-0.62, 0.98), lon = rand() * 360, lat = Math.asin(y) / D2R;
    const inPark = arcDist(dirOf(lat, lon), dirOf(14, 300)) < 14;
    const beachy = lon > 195 && lon < 285 && lat < -26;
    if (beachy && rand() < 0.75) continue;
    const town = isReserved(dirOf(lat, lon)) && !inPark;
    if (town && rand() < 0.85) continue;
    const r = rand();
    const ok = tryAt(lat, lon, (c) => {
      if (beachy) palm(c, 0, 0, rr(0.85, 1.15));
      else if (lat > 46 && r < 0.55) pine(c, 0, 0, rr(0.8, 1.3));
      else if (r < 0.62) tree(c, 0, 0, rr(0.8, 1.35));
      else if (r < 0.8) bush(c, 0, 0, rr(0.6, 1.0));
      else if (r < 0.9) rock(c, 0, 0, rr(0.6, 1.4));
      else flowers(c, 0, 0);
    }, r < 0.62 ? 0.7 : 0.45);
    if (ok) placed++;
  }
  // árvores no parque em volta do lago (mais densas)
  for (let k = 0; k < (LOW ? 40 : 70); k++) {
    const a = rand() * Math.PI * 2, rad = rr(7.8, 13);
    const d = offsetDir(dirOf(14, 300), headingVec(dirOf(14, 300), a / D2R), rad);
    tryAt(latOf(d), lonOf(d), (c) => (rand() < 0.75 ? tree(c, 0, 0, rr(0.9, 1.4)) : bush(c, 0, 0, rr(0.7, 1))), 0.7);
  }
}

function buildGrass() {

  const blade = (() => {
    const g = new THREE.BufferGeometry(), P = [], Cc = [], I = [];

      const a = b / 4 * Math.PI * 2 + 0.4, ox = Math.cos(a) * 0.06, oz = Math.sin(a) * 0.06, w = 0.05, h = 0.26 + (b % 2) * 0.12;
      const tx = ox * 2.2, tz = oz * 2.2, px = -Math.sin(a) * w, pz = Math.cos(a) * w, k = P.length / 3;
      P.push(ox - px, 0, oz - pz, ox + px, 0, oz + pz, tx, h, tz);
      Cc.push(base.r, base.g, base.b, base.r, base.g, base.b, tip.r, tip.g, tip.b);

  const prob = LOW ? 0.45 : 0.75;

    d.set(ico.pos[i * 3], ico.pos[i * 3 + 1], ico.pos[i * 3 + 2]);
    if (ha[i] < SEA + 0.4) continue;
    const ch = chunkOf(d);

function posePet(ch, dt) {
  const st = ch.st, B = ch.bones, P = ch.P;
  st.t += dt; const t = st.t;
  for (const b of B) b.rotation.set(0, 0, 0);
  B[0].position.set(0, P.bodyY, 0);
  const k = 1 - Math.exp(-dt * 8);
  st.w = lerp(st.w, clamp(st.speed / 3, 0, 1), k);
  st.phase += st.speed * dt * Math.PI / 0.28;
  const s1 = Math.sin(st.phase), w = st.w;
  if (st.pose === 'sleep') {
    B[0].position.y = P.bodyY * 0.55 + Math.sin(t * 1.4) * 0.006;
    for (let i = 0; i < 4; i++) B[3 + i].rotation.x = i < 2 ? -1.45 : 1.45;
    B[1].rotation.x = 0.35; B[1].rotation.y = 0.5; B[1].position.y = 0.04;
    B[2].rotation.y = 1.4; B[2].rotation.x = -1.2;
  } else if (st.pose === 'sit') {
    B[0].rotation.x = -0.55; B[0].position.y = P.bodyY * 0.85;
    B[3].rotation.x = B[4].rotation.x = 0.55; B[5].rotation.x = B[6].rotation.x = -0.9;
    B[1].rotation.x = 0.45;
    B[2].rotation.x = -0.2; B[2].rotation.y = Math.sin(t * (st.wag > 0 ? 18 : 2)) * (st.wag > 0 ? 0.7 : 0.15);
  } else {
    B[3].rotation.x = -s1 * 0.6 * w; B[6].rotation.x = -s1 * 0.6 * w;
    B[4].rotation.x = s1 * 0.6 * w; B[5].rotation.x = s1 * 0.6 * w;
    B[0].position.y += Math.abs(Math.cos(st.phase)) * 0.02 * w;
    B[1].rotation.x = Math.sin(st.phase * 2) * 0.05 * w;
    B[2].rotation.x = -0.35 + Math.sin(t * 2.2) * 0.08;
    B[2].rotation.y = Math.sin(t * (st.wag > 0 ? 18 : 3)) * (st.wag > 0 ? 0.6 : 0.2);
  }
  st.wag = Math.max(0, st.wag - dt);
  const L = st.look, LT = st.lookT, kl = 1 - Math.exp(-dt * 5);
  L.yaw = lerp(L.yaw, LT.yaw, kl); B[1].rotation.y += L.yaw;
  let fr = 0;
  st.blink -= dt; if (st.blink < 0) { st.blinkOn = 0.14; st.blink = rr(2, 5); }
  if (st.blinkOn > 0) { st.blinkOn -= dt; fr = 1; }
  if (st.talk) fr = (Math.floor(t * 6) % 2) ? 2 : 0;
  if (st.happy > 0) { st.happy -= dt; fr = 3; }
  if (st.sleep) fr = 1;
  setFace(ch, fr);
}

  renderer.setRenderTarget(rtColor);
  renderer.render(scene, C);
  rtColor.viewport.set(0, 0, W, H); rtColor.scissor.set(0, 0, W, H); rtColor.scissorTest = false;
  renderer.setClearColor(_pc, ca); renderer.shadowMap.autoUpdate = auto;
  sun.position.copy(_pv.sp); sun.target.position.copy(_pv.st);
  ch.rig.traverse((o) => { if (o.isMesh) o.receiveShadow = o.userData.rs; });
}

// ================= render e laço principal =================
function render() {
  renderer.setRenderTarget(rtColor); renderer.render(scene, camera);
  if (PORT.ch && PORT.rect && state.dialog) renderPortrait();
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
const clock = new THREE.Clock(false);
let hudT = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
  if (state.freeze) return;
  state.frame++;
  U.time.value = t; post.uniforms.time.value = t; waterMat.uniforms.time.value = t; skyMat.uniforms.time.value = t;
  if (DYN.pools) for (const m of DYN.pools) m.material.uniforms.time.value = t;
  if (state.mode === 'title') updateTitle(dt);
  stepPlayer(dt);
  updateGame(dt);
  updateActors(dt, t);
  updatePages(dt, t);
  updateDynamics(dt, t);
  updateDialog(dt);
  updateCamera(dt);
  updateSky(dt);
  updateChunks(camera.position, cam.far);
  updateOverlays(dt);
  hudT += dt; if (hudT > 0.1) { hudT = 0; updateHud(); if ($('menu').classList.contains('on')) refreshTasks(); }
  // muda a resolução antes de desenhar, para o quadro nunca sair em branco
  adaptResolution(dt);
  render();
}
function teleport(d, heading = 0) {
  player.d.copy(d).normalize();
  player.fwd.copy(headingVec(player.d, heading)); player.camFwd.copy(player.fwd); player.ctrlFwd.copy(player.fwd); player.vel.set(0, 0, 0);
  player.feet = groundAt(player.d);
  eastOf(player.d, SKYF.x); SKYF.z.crossVectors(SKYF.x, player.d).normalize();
  placePlayer(); snapCamera();
}
function quickStart() {
  TITLE.grp.visible = false; $('title').style.display = 'none';
  $('loader').classList.add('hidden');
  skyMat.uniforms.mode.value = 0;
  camera.fov = cam.fov; camera.updateProjectionMatrix();
  state.mode = 'play'; document.body.classList.add('playing'); $('hud').classList.add('on');
  if (QS.get('at')) { const [la, lo, hd] = QS.get('at').split(',').map(Number); teleport(dirOf(la, lo), hd || 0); }
  if (QS.get('pitch')) cam.pitch = +QS.get('pitch');
  if (QS.get('dist')) cam.distT = cam.dist = +QS.get('dist');
  if (QS.get('day')) { state.day = +QS.get('day'); refreshTasks(); }
  snapCamera();
}
async function boot() {
  if (IS_TOUCH) document.body.classList.add('touch');
  try { await Promise.race([Promise.all(['40px Bungee', '20px "Patrick Hand SC"', '20px Silkscreen', 'bold 20px Silkscreen'].map((f) => document.fonts.load(f))), wait(3000)]); } catch (e) {}
  await nextFrame();
  makeMaterials();
  defineWorld(); addLandmarks(); storyProps(); fillLots();
  await nextFrame();
  buildTerrain();
  await nextFrame();
  buildRoads();
  for (let i = 0; i < BUILDS.length; i++) BUILDS[i]();
  await nextFrame();
  streetFurniture(); scatter(); buildWires();
  await nextFrame();
  buildChunks(); buildGrass();
  hashColliders();
  spawnActors(); initPlayer(); initPages(); initDynamics(); buildTitle();
  ATL.tex.needsUpdate = true; FACE.tex.needsUpdate = true;
  setMusic(state.musicOn);
  refreshTasks(); updateHud();
  if (QS.has('skip')) quickStart();
  else { state.mode = 'title'; updateTitle(0); }
  renderer.compile(scene, camera); renderer.compile(postScene, postCam);
  await nextFrame();
  clock.start();
  requestAnimationFrame(frame);
  if (!QS.has('skip')) startTitle();
  window.__ready = true;
}
window.__gira = {
  state, player, ACTORS, cam, SPOTS, DISTRICTS, PAGES, PAGEOBJ, COLLIDERS, ATL, FACE, renderer, TITLE, insideTall, pushOut, groundAt, latOf, lonOf,
  go(la, lo, hd) { teleport(dirOf(la, lo), hd || 0); },
  near(id, back = 2.4) { const a = actor(id); const d = offsetDir(a.d, a.fwd, back); teleport(d, 0); player.fwd.copy(a.d).sub(player.d).normalize(); player.camFwd.copy(player.fwd); snapCamera(); },
  day(n) { state.day = n; refreshTasks(); },
  walk(x) { state.walked = x; },
  strike() { startStrike(); },
  talk(id) { startTalk(actor(id)); },
};
boot();

</script>
