<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>GIRA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Um planeta pequeno que só gira se você andar.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='41' r='19' fill='#8cc48c' stroke='#373f42' stroke-width='3'/%3E%3Cpath d='M19 38c4 2 8 0 11 3s1 6 6 7M37 29c2 3 6 4 9 2M22 50c4-1 7 1 10 0' fill='none' stroke='#373f42' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='8' r='4.2' fill='#373f42'/%3E%3Cpath d='M32 12v5.5M32 17.5l-3 4.3M32 17.5l3 4.3M28 14l-3 2M36 14l3 1.5' fill='none' stroke='#373f42' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Patrick+Hand+SC&family=Silkscreen:wght@400;700&display=swap">
    <style>
    /* o resto do visual está em src/styles/game.css; aqui só o que precisa aparecer antes do JavaScript carregar */
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #5fbfb9; }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- Carregando (tela branca com rabisco, igual à referência) ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 60; background: #fff; display: grid; place-items: center;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }
    #loader.wipe { transition: clip-path .95s cubic-bezier(.65, 0, .35, 1); clip-path: polygon(0 0, 100% 0, 100% -40%, 0 -12%); }
    #loader.hidden { display: none; }
    #loader .doodle { display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity .3s; }
    #loader .doodle svg { width: 58px; height: 58px; overflow: visible; }
    #loader .doodle .spin { transform-origin: 29px 34px; animation: spin 2.4s linear infinite; }
    @keyframes spin { to { transform: rotate(-360deg); } }
    #loader .doodle span { font-size: 13px; letter-spacing: .14em; color: #373f42; }
    #loader.quiet .doodle { opacity: 0; }

    #sheet { position: fixed; inset: 0; z-index: 61; pointer-events: none; display: none; overflow: hidden; }
    #sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 100%; box-shadow: 0 14px 40px rgba(55, 63, 66, .28); }
    #sheet.go canvas { transition: transform .9s cubic-bezier(.55, 0, .75, .4); transform: translateY(-122%) rotate(-7deg) scale(1.05); }
    </style>
  </head>
  <body>
    <!-- o mundo 3D (three.js) -->
    <canvas id="game"></canvas>
    <!-- balões, marcadores e emoções presos às pessoas do mundo: o jogo move a cada quadro -->
    <div id="bubbles" class="layer"></div>
    <!-- a interface (React) -->
    <div id="root"></div>
    <!-- o quadro do título que sai voando como uma folha -->
    <div id="sheet"><canvas id="sheetcv"></canvas></div>
    <div id="loader">
      <div class="doodle">
        <svg viewBox="0 0 58 58" fill="none" stroke="#373f42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <g class="spin"><path d="M13 35c0-9 7-16.5 16-16.5S45 26 45 35s-7 16-16 16S13 44 13 35z"/><path d="M19 30c3 2 6 1 8 3s1 5 4 6M33 23c1 2 4 3 6 2M18 42c3-1 5 1 7 0"/></g>
          <path d="M29 16.5v-5M29 11.5l-3 4M29 11.5l3 4M29 8.6a2.3 2.3 0 1 0 .1 0M26.5 13.5l-2 1.6M31.5 13l2.4 1"/>
          <path d="M38 9c2 1 3 3 3 5M42 7c3 2 4 5 4 8" stroke-width="1.6"/>
        </svg>
        <span>CARREGANDO</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
